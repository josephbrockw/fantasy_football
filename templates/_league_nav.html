{% comment %}
Shared league sub-nav. Include in a page's {% block nav %} with `league` and an
optional `active` key ("overview" / "free_agents" / "rookies" / "targets").
{% endcomment %}
<a href="{% url 'leagues:league_overview' league.slug %}"
   class="{% if active == 'overview' %}text-slate-100{% else %}hover:text-slate-200{% endif %}">{{ league.name }}</a>
<span class="text-slate-700">·</span>
<a href="{% url 'leagues:free_agents' league.slug %}"
   class="{% if active == 'free_agents' %}text-sky-300{% else %}hover:text-slate-200{% endif %}">Free agents</a>
<a href="{% url 'scouting:rookie_board' league.slug %}"
   class="{% if active == 'rookies' %}text-sky-300{% else %}hover:text-slate-200{% endif %}">Rookies</a>
<a href="{% url 'scouting:target_board' league.slug %}"
   class="{% if active == 'targets' %}text-sky-300{% else %}hover:text-slate-200{% endif %}">Targets</a>
<a href="{% url 'leagues:trades' league.slug %}"
   class="{% if active == 'trades' %}text-sky-300{% else %}hover:text-slate-200{% endif %}">Trades</a>
