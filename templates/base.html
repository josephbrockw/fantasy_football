{% load static %}<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dynasty HQ{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script src="{% static 'js/htmx.min.js' %}" defer></script>
</head>
<body class="h-full bg-slate-950 text-slate-200 antialiased">

  <header class="border-b border-slate-800 bg-slate-900/60">
    <nav class="mx-auto flex max-w-6xl items-center gap-6 px-4 py-3">
      <a href="{% url 'leagues:dashboard' %}"
         class="text-sm font-semibold tracking-tight text-white">
        Dynasty&nbsp;HQ
      </a>
      <div class="flex items-center gap-4 text-sm text-slate-400">
        <a href="{% url 'scouting:rookie_board' %}"
           class="hover:text-slate-200">Rookies</a>
        {% block nav %}{% endblock %}
      </div>
    </nav>
  </header>

  <main class="mx-auto max-w-6xl px-4 py-8">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
