services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: fantasy_football
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 5433 on the host: 5432 is taken by the local homebrew Postgres.
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fantasy_football"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/fantasy_football
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: dev-only-insecure-key
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
