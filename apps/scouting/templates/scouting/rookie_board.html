{% extends "base.html" %}

{% block title %}Rookie scouting · Dynasty HQ{% endblock %}

{% block content %}
  <div class="flex flex-wrap items-baseline justify-between gap-3">
    <h1 class="text-2xl font-semibold tracking-tight text-white">Rookie scouting</h1>
    <p class="text-sm text-slate-500">The incoming rookie class — build your board.</p>
  </div>

  <form class="mt-6 space-y-4"
        hx-get="{% url 'scouting:rookie_board_table' %}"
        hx-target="#board"
        hx-swap="innerHTML"
        hx-trigger="change, keyup from:input[name='q'] changed delay:300ms">

    <input type="hidden" name="sort" value="{{ sort }}">
    <input type="hidden" name="dir" value="{{ dir }}">

    <div class="flex flex-wrap items-center gap-3">
      <input type="search" name="q" value="{{ q }}"
             placeholder="Search by name…"
             class="w-56 rounded-lg border border-slate-700 bg-slate-900 px-3 py-1.5
                    text-sm text-slate-200 placeholder:text-slate-600
                    focus:border-sky-500 focus:outline-none">
    </div>

    <div class="flex flex-wrap items-center gap-2">
      <span class="text-xs uppercase tracking-wider text-slate-500">Position</span>
      <label class="cursor-pointer">
        <input type="radio" name="pos" value="" class="peer sr-only"
               {% if not pos %}checked{% endif %}>
        <span class="rounded-full border border-slate-700 px-3 py-1 text-xs text-slate-400
                     peer-checked:border-sky-500 peer-checked:bg-sky-500/15
                     peer-checked:text-sky-300">All</span>
      </label>
      {% for position in positions %}
        <label class="cursor-pointer">
          <input type="radio" name="pos" value="{{ position }}" class="peer sr-only"
                 {% if pos == position %}checked{% endif %}>
          <span class="rounded-full border border-slate-700 px-3 py-1 text-xs text-slate-400
                       peer-checked:border-sky-500 peer-checked:bg-sky-500/15
                       peer-checked:text-sky-300">{{ position }}</span>
        </label>
      {% endfor %}
    </div>
  </form>

  <div id="board" class="mt-6">
    {% include "scouting/_rookie_table.html" %}
  </div>
{% endblock %}
